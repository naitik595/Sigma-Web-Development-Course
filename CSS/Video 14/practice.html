<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property Practice</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .parent{
            border: 3px solid black;
            padding: 27px;
            margin: 43px;
            height: 2000px;
            /* position: relative; */
        }
        .box{
            border: 3px solid blue;
            width: 80vw;
            height: 111px;
            padding: 44px;
            margin: 23px;
        }
        .box1{
            background-color: red;
            /* position: relative;
            top: 40px;
            left: 40px; */
            position: sticky;
            top: 0;

        }
        .box2{
            background-color: green;
            /* position: absolute;
           bottom: 0;
           right: 0; */

           
        }
        .box3{
            background-color: yellow;
            /* position: fixed;
            top: 20px;
            left: 20px; */

         
        }
        .box4{
            background-color: turquoise;
        }

    </style>
</head>
<body>
    <div class="parent">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    </div>
</body>
</html>
