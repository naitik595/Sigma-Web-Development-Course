<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 5px 15px 5px #70a711;
        }

        .text-element {
            text-shadow: 10px 5px 3px #e695f7;
            /* outline: 2px solid black;
            border-radius: 8px;
            border: 2px solid green;
            outline-offset: 19px; */
        }
    </style>
</head>

<body>
    <div class="box">
        I am a box
    </div>
    <p class="text-element">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Nesciunt dolore fugit corrupti placeat illo aliquid
        perferendis blanditiis quam eaque saepe optio culpa in officia dicta maxime, consequuntur vel dolorem recusandae
        quae! Maxime, numquam sint?
    </p>

</body>

</html>
