<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card Sizing Units Practice</title>
    <style>
        .testbox{
            height: 50vh;
            width: 50vw;
            background-color: lightblue;
        }
        body{
            height: 100vh;
        }
        html{
            font-size: 16px;
        }
        .card{
            width: 300px;
            padding: 1rem;
            border: 2px solid gray;
            border-radius: 8px;
            font-size: 20px;        
        }
        .card > img{
            width: 100%;
        }
        .card > h2{
            font-size: 1.5em;
        }
        .card > p{
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        .card > button{
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="Screenshot 2026-07-01 173043.png" alt="image">
        <h2>Naitik Rajput</h2>
        <p>I am Naitik I am currently learning web development from scratch.</p>
        <button>Follow</button>
    </div>
    <div class="testbox">

    </div>
    
</body>
</html>
