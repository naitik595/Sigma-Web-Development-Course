<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows & Outlines Masterclass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a; /* Premium Dark Background */
            font-family: 'Segoe UI', sans-serif;
            color: white;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-top: 40px;
            color: #f59e0b;
            font-size: 20px;
        }

        .base-box {
            width: 250px;
            height: 100px;
            background-color: #1e293b;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* -----------------------------------------
           1. BOX SHADOW EFFECTS
        ----------------------------------------- */
        .shadow-box-1 {
            /* 🔥 Master Formula: X-offset Y-offset Blur Spread Color */
            box-shadow: 5px 5px 15px 0px rgba(0, 0, 0, 0.6);
        }

        .shadow-box-2 {
            /* 🔥 Center Glow: X aur Y ko 0 kar diya */
            box-shadow: 0px 0px 25px 2px #3b82f6;
        }

        /* -----------------------------------------
           2. OUTLINE EFFECTS
        ----------------------------------------- */
        .outline-box {
            border: 3px solid #ef4444; /* Red Border */
            
            /* 🔥 Outline Formula: Width Style Color */
            outline: 3px solid #10b981; /* Green Outline */
            outline-offset: 5px;  /* 💡 Border aur Outline ke beech ka gap */
        }
    </style>
</head>
<body>

    <h1>Shadows & Outlines Playground</h1>

    <h2>1. Normal Drop Shadow (Niche/Right mein dhalan)</h2>
    <div class="base-box shadow-box-1">Drop Shadow</div>

    <h2>2. Center Glow Shadow (Charo taraf roshni)</h2>
    <div class="base-box shadow-box-2">Neon Glow</div>

    <h2>3. Border vs Outline vs Offset</h2>
    <div class="base-box outline-box">Outline Box</div>

</body>
</html>
