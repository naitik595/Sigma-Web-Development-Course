<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Simple Login Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'poppins', sans-serif;
            background-color: #000000;
        }

        .netflix-logo {
            color: red;
            margin-left: 150px;
            margin-top: 10px;
            font-size: 3rem;
            font-weight: bold;
        }

        .line-break {
            border: 0;
            height: 1px;
            background-color: #333333;
            margin: 20px 0;
        }
        .login-container{
            width: 90%;
            max-width: 450px;
            margin-top: 40px;
            margin-left: auto;
            margin-right: auto;
        }
         h2{
            color: #ffffff;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .sub-text{
            color: #8c8c8c;
            margin-right: 0;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }
        .input-field{
            width: 100%;
            display: block;
            margin-top: 25px;
            padding: 20px;
            background-color: #161616;
            border: 1px solid #444444;
            border-radius: 4px;
            color: white;
            font-size: 1rem;
        }
        .continue-btn{
            width: 100%;
            display: block;
            margin-top: 15px;
            padding: 16px;
            background-color: red;
            border: 1px solid #161616;
            border-radius: 4px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }
        h4{
            color: white;
            font-weight: 400;
            margin-top: 50px;
            cursor: pointer;
        }
        .footer-text{
            color:gray;
            font-size: 0.75rem;
            margin-top: 30px;
        }

    </style>
</head>

<body>
    <h1 class="netflix-logo">NETFLIX</h1>
    <hr class="line-break">

    <div class="login-container">
        <h2>Enter your info to sign in</h2>

        <p class="sub-text">Or get started with a new account.</p>

        <input type="email" class="input-field" placeholder="Email or mobile number">

        <button class="continue-btn">Continue</button>

        <h4>Get Help</h4>

        <footer>
            <p class="footer-text">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
        </footer>
         
    </div>
    
</body>

</html>
