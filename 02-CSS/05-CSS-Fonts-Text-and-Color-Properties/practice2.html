<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice CSS Properties</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap');
        body{
            font-family: 'Poppins', sans-serif;
            background-color: aqua;
        }

        #main-title{
            text-align: center;
            color: tomato;
            background-color: rgba(19, 209, 16, 0.600);
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
        }
        .sub-heading{
            text-transform: capitalize;
            font-family: 'Inter', sans-serif;
            color: #285DB5;
            background-color: rgb(255, 99, 71 );
        }
        .para1{
            color: lightcoral;
            background-color: gold;
            font-weight: 300;
            line-height: 1.5;
            text-transform: uppercase;
        }
        .para2{
            color: fuchsia;
            background-color: rgba(255, 0, 0, 0.6);
            text-transform: lowercase;
            margin: 5px;
            padding: 10px;
        }
        .para3{
            color: blue;
            background-color: chocolate;
            text-decoration-line: underline;
            text-transform: capitalize;
            
        }
        .para4{
            color:rgba(239, 7, 30, 0.948);
            background-color: rgb(0, 0, 0);
            font-size: 20px;
            border: 5px solid red;
            padding: 35px;
            margin: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 id="main-title">Welcome To My Web Page</h1>
    <h2 class="sub-heading">about me</h2>
    <p class="para1">
        This is a simple website created for CSS practice.
    </p>
    <p class="para2">
        My name is Naitik and I am learning web development step by step.
    </p>
    <p class="para3">
        I am currently practicing CSS properties like color, font, and text styling.
    </p>
    <p class="para4">
        My goal is to become a professional web developer in the future.
    </p>
    
</body>
</html>
