<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Boxmodel Practice</title>
    <style>
        #box{
            background-color: yellow;
            border: 5px solid red;
            padding: 100px;
            margin: 100px;
        }
        .box1{
            color: red;
            background-color: salmon;
            border: 10px solid darkblue;
            padding: 50px;
            margin: 25px;

        }
        .box2{
            color: seagreen;
            background-color: silver;
            border: 15px solid black;
            padding: 25px;
            margin: 35px;
        }
        div{
            text-align: center;
        }
        body{
            background-color: pink;
        }
    </style>
</head>
<body>
    <div id="box">
        Naitik
    </div>
    <div class="box box1">This is a box 1</div>
    <div class="box box2">This is a box 2</div>
    
</body>
</html>
