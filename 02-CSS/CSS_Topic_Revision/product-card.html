<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build a simple product card</title>
    <link rel="stylesheet" href="product-card.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="product-card">
        <div class="image-container">
            <img src="image/photo-1594035910387-fea47794261f.avif" alt="luxurious-perfume">
            <span class="badge">-20%</span>
            <div class="heart-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d4a853" stroke-width="1.5">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                </svg>

            </div>
        </div>
        <div class="overlap-text">
            <p class="first-para">MAISON ECLAT</p>
            <p class="second-para">Nuit Absolue</p>
        </div>
        <div class="product-description">
            <p class="product-name">EAU DE PARFUM . 100 ML</p>
            <div class="product-rating">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path
                        d="M6 1l1.236 2.505 2.764.402-2 1.949.472 2.75L6 7.255l-2.472 1.351L4 5.856 2 3.907l2.764-.402z"
                        fill="#d4a853" stroke="#d4a853" stroke-width="0.75" />
                </svg>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path
                        d="M6 1l1.236 2.505 2.764.402-2 1.949.472 2.75L6 7.255l-2.472 1.351L4 5.856 2 3.907l2.764-.402z"
                        fill="#d4a853" stroke="#d4a853" stroke-width="0.75" />
                </svg>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path
                        d="M6 1l1.236 2.505 2.764.402-2 1.949.472 2.75L6 7.255l-2.472 1.351L4 5.856 2 3.907l2.764-.402z"
                        fill="#d4a853" stroke="#d4a853" stroke-width="0.75" />
                </svg>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path
                        d="M6 1l1.236 2.505 2.764.402-2 1.949.472 2.75L6 7.255l-2.472 1.351L4 5.856 2 3.907l2.764-.402z"
                        fill="#d4a853" stroke="#d4a853" stroke-width="0.75" />
                </svg>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <defs>
                        <linearGradient id="half">
                            <stop offset="50%" stop-color="#d4a853" />
                            <stop offset="50%" stop-color="transparent" />
                        </linearGradient>
                    </defs>
                    <path
                        d="M6 1l1.236 2.505 2.764.402-2 1.949.472 2.75L6 7.255l-2.472 1.351L4 5.856 2 3.907l2.764-.402z"
                        fill="url(#half)" stroke="#d4a853" stroke-width="0.75" />
                </svg>
                <span class="rating-numbers">(214)</span>
            </div>

        </div>
        <div class="about-product">
            <p>A rare nocturnal blend anchored in aged oud and smoked vetiver — evolving over hours into a warm,
                resinous trail.</p>
            <div class="perfume-fragrance-names">
                <span class="first-name">BLACK OUD</span>
                <span class="second-name">AMBER</span>
                <span class="third-name">SANDALWOOD</span>
                <span class="fourth-name">VETIVER</span>
            </div>
            <div class="bottom-line"></div>
            <div class="price-section">
                <p class="real-price"> ₹15,500</p>
            </div>
            <div class="offer-price-and-other">
                <h3 class="offer-price">₹12,400</h3>
                <div class="qty-selector">
                    <span class="qty-btn qty-minus">-</span>
                    <span class="qty-number">1</span>
                    <span class="qty-btn qty-plus">+</span>
                </div>
            </div>
        </div>
        <div class="product-btn">
        <button>ADD TO BAG</button>
        </div>
    </div>
</body>

</html>
