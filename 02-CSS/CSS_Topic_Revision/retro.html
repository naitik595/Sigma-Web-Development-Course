<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Login Page</title>
    <link rel="stylesheet" href="retro.css">
</head>

<body>
    <div class="container">
        <div class="card-title">Login</div>
        <div class="input-group">
            <label class="input-label">EMAIL</label>
            <input type="email" class="input-field" placeholder="your@email.com">
        </div>
        <div class="input-group">
            <label class="input-label">PASSWORD</label>
            <input type="password" class="input-field" placeholder="*********">
        </div>

        <button class="login-btn">SIGN IN</button>
        <div class="divider">
            <span class="line"></span>
            <span class="text">OR</span>
            <span class="line"></span>
        </div>
        <div class="social-media">
            <button class="media-text">G</button>
            <button class="media-text">F</button>
            <button class="media-text">X</button>
        </div>
        <div class="footer">
            <span>Don't have an account?</span>
            <span class="footer-text"><a href="#">Sign up</a></span>
        </div>
    </div>

</body>

</html>
